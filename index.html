<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Уақытты тап! ⏰</title>
    <style>
        body {
            font-family: "Comic Sans MS", Arial, sans-serif;
            text-align: center;
            background-color: #fce4ec;
        }
        .container {
            background: white;
            width: 500px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 6px 6px 15px rgba(0, 0, 0, 0.3);
        }
        .clock {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 20px auto;
            border: 8px solid #ff4081;
            border-radius: 50%;
            background: #fff;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.3);
        }
        .clock span {
            position: absolute;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }
        .hand {
            position: absolute;
            background: black;
            transform-origin: 50% 100%;
            left: 50%;
            bottom: 50%;
            transform: translateX(-50%) rotate(0deg);
            border-radius: 5px;
        }
        .hour {
            width: 10px;
            height: 60px;
            background: #ff5722;
        }
        .minute {
            width: 7px;
            height: 90px;
            background: #03a9f4;
        }
        .buttons button {
            padding: 15px;
            margin: 8px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 22px;
            width: 140px;
            font-weight: bold;
            box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.3);
        }
        #feedback {
            font-size: 24px;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Уақытты тап! ⏰</h1>
        <p>Көрсетілген уақытқа сәйкес дұрыс жауапты таңдаңыз!</p>
        <div class="clock" id="clockDisplay">
            <div class="hand hour" id="hourHand"></div>
            <div class="hand minute" id="minuteHand"></div>
        </div>
        <div class="buttons">
            <button onclick="checkAnswer(this)"></button>
            <button onclick="checkAnswer(this)"></button>
            <button onclick="checkAnswer(this)"></button>
            <button onclick="checkAnswer(this)"></button>
        </div>
        <div id="feedback"></div>
        <audio id="correctSound" src="correct.mp3"></audio>
        <audio id="wrongSound" src="wrong.mp3"></audio>
    </div>
    <script>
        function generateClockNumbers() {
            let clock = document.getElementById("clockDisplay");
            for (let i = 1; i <= 24; i++) {
                let angle = (i - 6) * 15;
                let x = 50 + 42 * Math.cos(angle * Math.PI / 180);
                let y = 50 + 42 * Math.sin(angle * Math.PI / 180);
                let num = document.createElement("span");
                num.style.left = `${x}%`;
                num.style.top = `${y}%`;
                num.style.transform = "translate(-50%, -50%)";
                num.textContent = i;
                clock.appendChild(num);
            }
        }

        let correctTime;

        function generateTime() {
            let hours = Math.floor(Math.random() * 24);
            let minutes = Math.floor(Math.random() * 4) * 15;
            correctTime = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
            
            document.getElementById('hourHand').style.transform = `translateX(-50%) rotate(${(hours % 24) * 15 + minutes * 0.25}deg)`;
            document.getElementById('minuteHand').style.transform = `translateX(-50%) rotate(${minutes * 6}deg)`;

            let answers = [correctTime];
            while (answers.length < 4) {
                let randomH = Math.floor(Math.random() * 24);
                let randomM = Math.floor(Math.random() * 4) * 15;
                let fakeTime = `${randomH.toString().padStart(2, '0')}:${randomM.toString().padStart(2, '0')}`;
                if (!answers.includes(fakeTime)) answers.push(fakeTime);
            }
            
            answers.sort(() => Math.random() - 0.5);
            document.querySelectorAll('.buttons button').forEach((btn, index) => {
                btn.textContent = answers[index];
            });
        }

        function checkAnswer(button) {
            let feedback = document.getElementById('feedback');
            if (button.textContent === correctTime) {
                feedback.textContent = "✅ Дұрыс!";
                feedback.style.color = "green";
                document.getElementById('correctSound').play();
            } else {
                feedback.textContent = "❌ Қате! Дұрыс жауап: " + correctTime;
                feedback.style.color = "red";
                document.getElementById('wrongSound').play();
            }
            setTimeout(generateTime, 1500);
        }

        generateClockNumbers();
        generateTime();
    </script>
</body>
</html>
