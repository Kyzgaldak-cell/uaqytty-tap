<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Уақытты тап! ⏰</title>
    <style>
        body {
            font-family: "Comic Sans MS", Arial, sans-serif;
            text-align: center;
            background-color: #f0f8ff;
        }
        .container {
            background: white;
            width: 450px;
            margin: 50px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 4px 4px 12px rgba(0, 0, 0, 0.2);
        }
        .clock {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 20px auto;
            border: 3px solid black;
            border-radius: 50%;
            background: white;
        }
        .clock span {
            position: absolute;
            font-size: 18px;
            font-weight: bold;
        }
        .hand {
            position: absolute;
            background: black;
            transform-origin: 50% 100%;
            left: 50%;
            bottom: 50%;
            transform: translateX(-50%) rotate(0deg);
        }
        .hour {
            width: 6px;
            height: 50px;
            background: black;
        }
        .minute {
            width: 4px;
            height: 70px;
            background: red;
        }
        .buttons button {
            padding: 12px;
            margin: 5px;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            width: 120px;
        }
        #feedback {
            font-size: 20px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Уақытты тап! ⏰</h1>
        <p>Көрсетілген уақытқа сәйкес дұрыс жауапты таңдаңыз!</p>
        <div class="clock" id="clockDisplay">
            <div class="hand hour" id="hourHand"></div>
            <div class="hand minute" id="minuteHand"></div>
        </div>
        <div class="buttons">
            <button onclick="checkAnswer(this)"></button>
            <button onclick="checkAnswer(this)"></button>
            <button onclick="checkAnswer(this)"></button>
            <button onclick="checkAnswer(this)"></button>
        </div>
        <div id="feedback"></div>
        <audio id="correctSound" src="correct.mp3"></audio>
        <audio id="wrongSound" src="wrong.mp3"></audio>
    </div>
    <script>
        function generateClockNumbers() {
            let clock = document.getElementById("clockDisplay");
            for (let i = 1; i <= 12; i++) {
                let num = document.createElement("span");
                let angle = (i - 3) * 30;
                let x = 50 + 40 * Math.cos(angle * Math.PI / 180);
                let y = 50 + 40 * Math.sin(angle * Math.PI / 180);
                num.style.left = `${x}%`;
                num.style.top = `${y}%`;
                num.style.transform = "translate(-50%, -50%)";
                num.textContent = i;
                clock.appendChild(num);
            }
        }

        let correctTime;

        function generateTime() {
            let hours = Math.floor(Math.random() * 12) + 1;
            let minutes = Math.floor(Math.random() * 4) * 15;
            correctTime = `${hours}:${minutes.toString().padStart(2, '0')}`;
            
            document.getElementById('hourHand').style.transform = `translateX(-50%) rotate(${(hours % 12) * 30 + minutes * 0.5}deg)`;
            document.getElementById('minuteHand').style.transform = `translateX(-50%) rotate(${minutes * 6}deg)`;

            let answers = [correctTime];
            while (answers.length < 4) {
                let randomH = Math.floor(Math.random() * 12) + 1;
                let randomM = Math.floor(Math.random() * 4) * 15;
                let fakeTime = `${randomH}:${randomM.toString().padStart(2, '0')}`;
                if (!answers.includes(fakeTime)) answers.push(fakeTime);
            }
            
            answers.sort(() => Math.random() - 0.5);
            document.querySelectorAll('.buttons button').forEach((btn, index) => {
                btn.textContent = answers[index];
            });
        }

        function checkAnswer(button) {
            let feedback = document.getElementById('feedback');
            if (button.textContent === correctTime) {
                feedback.textContent = "✅ Дұрыс!";
                feedback.style.color = "green";
                document.getElementById('correctSound').play();
            } else {
                feedback.textContent = "❌ Қате! Дұрыс жауап: " + correctTime;
                feedback.style.color = "red";
                document.getElementById('wrongSound').play();
            }
            setTimeout(generateTime, 1500);
        }

        generateClockNumbers();
        generateTime();
    </script>
</body>
</html>
